<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Ôn tập Hán ngữ</title>
<style>
:root{--bg:#f7f8f6;--card:#fff;--ink:#1d2433;--mut:#6b7280;--red:#b5302a;--jade:#1f6f6b;--bd:#dfe3df;--ok:#1f7a4d;--bad:#b5302a;--hl:#fff1d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#14181f;--card:#1d232d;--ink:#e8ebf0;--mut:#98a2b3;--red:#e5655d;--jade:#5fb8b2;--bd:#323a47;--ok:#5fcf93;--bad:#ef8179;--hl:#3a3220}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#14181f;--card:#1d232d;--ink:#e8ebf0;--mut:#98a2b3;--red:#e5655d;--jade:#5fb8b2;--bd:#323a47;--ok:#5fcf93;--bad:#ef8179;--hl:#3a3220}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Be Vietnam Pro","Segoe UI",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
.kai{font-family:"Kaiti SC","KaiTi","STKaiti","Noto Serif CJK SC",serif}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--card);border-bottom:2px solid var(--red);display:flex;overflow-x:auto}
nav button{flex:1 0 auto;border:0;background:none;color:var(--mut);padding:12px 14px;font:600 14px inherit;font-family:inherit;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--red);box-shadow:inset 0 -3px 0 var(--red)}
main{max-width:860px;margin:0 auto;padding:16px}
.pane{display:none}.pane.on{display:block}
h2{font-size:20px;margin:24px 0 10px}h2:first-child{margin-top:4px}
button{font-family:inherit}
.btn,.ctl button{border:1px solid var(--bd);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 14px;font-size:14px;cursor:pointer}
.btn:hover,.ctl button:hover{border-color:var(--red)}
.btn.pri{background:var(--red);color:#fff;border-color:var(--red)}
.ctl{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.cc{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;text-align:center}
.cc .big{height:130px;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:6px;background-image:linear-gradient(#f0c9c5,#f0c9c5),linear-gradient(90deg,#f0c9c5,#f0c9c5);background-size:100% 1px,1px 100%;background-position:center;background-repeat:no-repeat}
.cc .big img{max-height:126px;max-width:100%}
.cc .big .kai{font-size:88px;line-height:1;color:#1d2433}
.chips{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin:8px 0;font-style:normal}
.chips i{font-style:normal;font-size:12px;border:1px solid var(--bd);border-radius:999px;padding:1px 8px;color:var(--mut)}
.chips i.on{background:var(--red);color:#fff;border-color:var(--red)}
.cc .py{font-weight:700;margin-top:6px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--bd);border-radius:10px;overflow:hidden}
td,th{padding:8px 10px;border-bottom:1px solid var(--bd);text-align:left;font-size:15px}
td.h{font-size:24px}
.wrap{overflow-x:auto}
.tone{background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--red);border-radius:8px;padding:12px 16px;margin:10px 0}
.tone b.r{color:var(--red)}
.ex span{display:inline-block;margin:3px 14px 3px 0}
.sc{color:var(--mut);font-size:14px;margin-bottom:8px}
.q{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:24px;text-align:center;margin-bottom:12px}
.q .kai{font-size:72px;line-height:1.1}.q .mean{font-size:26px;font-weight:700}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.o{border:2px solid var(--bd);background:var(--card);color:var(--ink);border-radius:10px;padding:14px 8px;font-size:17px;cursor:pointer}
.o.k{font-size:34px}
.o:hover{border-color:var(--jade)}.o.good{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}.o.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--card))}
.fb{min-height:28px;margin:10px 0;font-weight:600}
.area{min-height:56px;border:2px dashed var(--bd);border-radius:10px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;margin:12px 0;align-items:center;background:var(--card)}
.tk{border:1px solid var(--bd);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 12px;font-size:18px;cursor:pointer}
.tk:hover{border-color:var(--red)}
.hint{background:var(--hl);border-radius:8px;padding:8px 12px;margin:8px 0}
.shake{animation:sh .3s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.board{position:relative;margin-top:8px}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.ln{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.tile{height:58px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;cursor:pointer;font-size:11px;line-height:1.15;overflow:hidden}
span.tile{border:0;background:none}
.tile b{font-size:22px;font-weight:600}.tile small{font-size:10px;color:var(--mut)}
.tile.v{border-color:var(--jade)}
.tile.sel{background:var(--hl);border-color:var(--red);border-width:2px}
.tile.hn{outline:3px solid var(--ok)}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
@media(max-width:480px){.tile{height:50px}.tile b{font-size:18px}.tile{font-size:9.5px}}
.wc{display:flex;flex-wrap:wrap;gap:16px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px;align-items:center}
.wi{flex:0 0 150px}.wh{font-size:44px;line-height:1.1}.wp{font-size:20px;font-weight:700;color:var(--red)}.wm{margin:2px 0 8px}
.wr{display:flex;flex-wrap:wrap;gap:12px;flex:1 1 260px}
.ch{width:136px}
.cv{width:136px;height:136px;background:#fff;border:1px solid var(--bd);border-radius:8px;cursor:pointer;display:block}
.cv .gl{stroke:#f0b9b4;stroke-width:.5;stroke-dasharray:2 2;fill:none}
.cv .gh{fill:#dcdcdc}.cv .gf{fill:#1d2433;opacity:0}
.cv polyline{fill:none;stroke:#1d2433;stroke-width:10;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 2;stroke-dashoffset:1;opacity:0}
.cl{font-size:14px;margin:4px 0;display:flex;align-items:center;gap:6px;font-weight:600}
.mini{border:1px solid var(--bd);background:var(--card);color:var(--ink);border-radius:6px;cursor:pointer;padding:1px 7px;font-size:13px}
.chips{justify-content:flex-start;margin:4px 0}
.exs{display:inline-flex;align-items:center;gap:6px;margin:4px 14px 4px 0}
</style></head><body>
<nav id="nav"></nav>
<main>

</main>

const SS=[["我","Tôi"],["你","Bạn"],["他","Anh ấy"],["她","Cô ấy"],["您","Ngài"]].map(s=>({z:[s[0]],v:s[1],k:s[0],p:0})).concat(W.map(w=>({z:["王",w[0]],v:w[2]+" Vương",k:"王"+w[0],p:0})),[["我们","Chúng tôi"],["你们","Các bạn"],["他们","Họ (nam)"],["她们","Họ (nữ)"]].map(s=>({z:[s[0]],v:s[1],k:s[0],p:1})));
const PT=[[["是"],[],["là"],[],0,0],[["不","是"],[],["không","phải","là"],[],0,0],[["是"],["吗"],["có","phải","là"],["không"],1,0],[["也","是"],[],["cũng","là"],[],0,0],[["也","不","是"],[],["cũng","không","phải","là"],[],0,0],[["也","是"],["吗"],["cũng","là"],["phải","không"],1,0],[["都","是"],[],["đều","là"],[],0,1],[["都","不","是"],[],["đều","không","phải","là"],[],0,1]];
const SEN=[];SS.forEach(s=>OB.forEach(o=>{if(o.k.endsWith(s.k)||s.k.endsWith(o.k)&&s.k.length>1)return;PT.forEach(p=>{if(p[5]&&!s.p)return;const vv=s.v.replace(/ \(.*\)/,"");SEN.push({z:[...s.z,...p[0],...o.z,...p[1]],v:[s.v,...p[2],o.v,...p[3]],q:p[4]})})}));
let mode="zv",ord=sh(SEN.map((_,i)=>i)),pos=0,ans=[],pool=[],hintOn=0;
function sPane(){const s=SEN[ord[pos]],zs=s.z.join(""),vs=s.v.join(" ")+(s.q?"?":"."),zp=zs+(s.q?"？":"。");const tgt=mode=="zv"?s.v:s.z,sep=mode=="zv"?" ":"";
if(!pool.length&&!ans.length)pool=sh(tgt.map((t,i)=>({t,i})));
$("#p4").innerHTML=`<div class="sc">Câu ${pos+1} / ${SEN.length} (đã xáo trộn toàn bộ)</div><div class="ctl"><button class="btn ${mode=="zv"?"pri":""}" id="m1">Trung → Việt</button><button class="btn ${mode=="vz"?"pri":""}" id="m2">Việt → Trung</button></div>
<div class="q">${mode=="zv"?`<div class="kai" style="font-size:34px">${zp}</div>`:`<div class="mean" style="font-size:22px">${vs}</div>`}<div class="sc">${mode=="zv"?"Sắp xếp các từ tiếng Việt thành câu đúng":"Sắp xếp các từ tiếng Trung thành câu đúng"}</div></div>
<div class="area" id="ar">${ans.map((a,k)=>`<button class="tk" data-k="${k}">${a.t}</button>`).join("")||'<span class="sc">Bấm vào các từ bên dưới…</span>'}</div>
<div class="area" style="border-style:solid">${pool.map((a,k)=>`<button class="tk" data-p="${k}">${a.t}</button>`).join("")}</div>
<div class="ctl"><button class="btn pri" id="ck">Kiểm tra</button><button class="btn" id="hn">💡 Gợi ý đáp án</button><button class="btn" id="sp">🔊 Đọc mẫu</button><button class="btn" id="rs">Làm lại</button><button class="btn" id="nx">Câu khác →</button></div>
<div class="hint" id="hb" style="display:${hintOn?"block":"none"}"><b>Đáp án:</b> ${mode=="zv"?vs:zp}<br><span class="sc">${mode=="zv"?"":vs}</span></div><div class="fb" id="fb"></div>`;
document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{ans.push(pool.splice(+b.dataset.p,1)[0]);sPane()});
document.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{pool.push(ans.splice(+b.dataset.k,1)[0]);sPane()});
$("#m1").onclick=()=>{mode="zv";rs()};$("#m2").onclick=()=>{mode="vz";rs()};
$("#sp").onclick=()=>say(zs);$("#hn").onclick=()=>{hintOn=1;$("#hb").style.display="block"};
$("#rs").onclick=()=>{rs()};
$("#nx").onclick=()=>{pos=(pos+1)%SEN.length;rs()};
$("#ck").onclick=()=>{const ok=ans.length==tgt.length&&ans.every((a,i)=>a.t==tgt[i]);const f=$("#fb");if(ok){f.style.color="var(--ok)";f.textContent="Chính xác! Đang chuyển sang câu tiếp…";say(zs);setTimeout(()=>{pos=(pos+1)%SEN.length;rs()},1800)}else{f.style.color="var(--bad)";f.textContent="Chưa đúng, thử sắp xếp lại hoặc bấm gợi ý.";$("#ar").classList.add("shake");setTimeout(()=>$("#ar")&&$("#ar").classList.remove("shake"),400)}};}
function rs(){ans=[];pool=[];hintOn=0;sPane()}
sPane();
/* Pikachu */
const R=6,C=8;let g,sel,left,moves,hp=null;
const D=[[1,0],[-1,0],[0,1],[0,-1]];
function findPath(a,b){const q=[[a[0],a[1],-1,0,[a]]],seen=new Set();while(q.length){const [r,c,d,t,p]=q.shift();for(let nd=0;nd<4;nd++){const nt=t+(d>=0&&nd!=d?1:0);if(nt>2)continue;const nr=r+D[nd][0],nc=c+D[nd][1];if(nr<0||nc<0||nr>R+1||nc>C+1)continue;if(nr==b[0]&&nc==b[1])return[...p,[nr,nc]];if(g[nr][nc])continue;const k=nr+","+nc+","+nd+","+nt;if(seen.has(k))continue;seen.add(k);q.push([nr,nc,nd,nt,[...p,[nr,nc]]])}}return null}
function pInit(){const ts=[];sh(V).slice(0,24).forEach((w,i)=>ts.push({i,k:"h",w},{i,k:"v",w}));const a=sh(ts);g=Array.from({length:R+2},()=>Array(C+2).fill(null));for(let r=1;r<=R;r++)for(let c=1;c<=C;c++)g[r][c]=a[(r-1)*C+c-1];sel=null;hp=null;left=24;moves=0;pDraw()}
function pDraw(){let h=`<div class="sc">Còn ${left} cặp · ${moves} lượt nối. Ghép chữ Hán với nghĩa tiếng Việt, đường nối tối đa 2 góc rẽ.</div><div class="ctl"><button id="pH">💡 Gợi ý</button><button id="pS">🔀 Xáo trộn</button><button id="pN">↻ Ván mới</button></div>`;
if(!left)h+=`<div class="hint"><b>Hoàn thành!</b> Bạn đã nối hết ${24} cặp từ.</div>`;
h+=`<div class="board"><svg class="ln" viewBox="0 0 ${C} ${R}" preserveAspectRatio="none"><polyline id="pl" fill="none" stroke="var(--red)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg><div class="grid">`;
for(let r=1;r<=R;r++)for(let c=1;c<=C;c++){const t=g[r][c];const cl=(sel&&sel[0]==r&&sel[1]==c?" sel":"")+(hp&&hp.some(x=>x[0]==r&&x[1]==c)?" hn":"");h+=t?`<button class="tile ${t.k}${cl}" data-r="${r}" data-c="${c}">${t.k=="h"?`<b class="kai">${t.w[0]}</b><small>${t.w[1]}</small>`:`<span>${t.w[2]}</span>`}</button>`:`<span class="tile"></span>`}
$("#p5").innerHTML=h+"</div></div>";
$("#pN").onclick=pInit;$("#pH").onclick=()=>{for(let r=1;r<=R;r++)for(let c=1;c<=C;c++)for(let r2=1;r2<=R;r2++)for(let c2=1;c2<=C;c2++){const a=g[r][c],b=g[r2][c2];if(a&&b&&a.i==b.i&&a.k=="h"&&b.k=="v"&&findPath([r,c],[r2,c2])){hp=[[r,c],[r2,c2]];pDraw();return}}};
$("#pS").onclick=()=>{const cells=[];for(let r=1;r<=R;r++)for(let c=1;c<=C;c++)if(g[r][c])cells.push([r,c]);const ts=sh(cells.map(x=>g[x[0]][x[1]]));cells.forEach((x,i)=>g[x[0]][x[1]]=ts[i]);sel=null;hp=null;pDraw()};
document.querySelectorAll(".tile[data-r]").forEach(b=>b.onclick=()=>{const p=[+b.dataset.r,+b.dataset.c],t=g[p[0]][p[1]];hp=null;if(t.k=="h")say(t.w[0]);
if(!sel){sel=p;pDraw();return}
if(sel[0]==p[0]&&sel[1]==p[1]){sel=null;pDraw();return}
const o=g[sel[0]][sel[1]];
if(o.i==t.i&&o.k!=t.k){const pa=findPath(sel,p);if(pa){moves++;$("#pl").setAttribute("points",pa.map(x=>(x[1]-.5)+","+(x[0]-.5)).join(" "));const s0=sel;g[s0[0]][s0[1]]=null;sel=null;const tmp=g[p[0]][p[1]];setTimeout(()=>{g[p[0]][p[1]]=null;left--;pDraw()},450);return}}
sel=p;pDraw()})}
pInit();
document.querySelector("nav button").click();
</script></body></html>
